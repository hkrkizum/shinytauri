project:
  type: website
  output-dir: _site

lang: ja
brand: _brand.yaml

website:
  title: shinytauri
  description: Shiny アプリを Windows デスクトップアプリとして配布するための CLI マニュアル
  site-url: https://hkrkizum.github.io/shinytauri/
  repo-url: https://github.com/hkrkizum/shinytauri
  favicon: images/shinytauri.svg
  page-navigation: true
  search: true
  page-footer:
    left: "[マニュアルのライセンス（CC BY 4.0）](license.qmd)"
  navbar:
    title: shinytauri
    logo: images/shinytauri.svg
    logo-alt: shinytauri の六角形ロゴ
    background: light
    foreground: dark
    left:
      - text: CLI マニュアル
        href: index.qmd
    right:
      - text: GitHub
        href: https://github.com/hkrkizum/shinytauri
  sidebar:
    style: docked
    contents:
      - section: アプリを配布する
        contents:
          - index.qmd
          - installation.qmd
          - dependencies.qmd
          - configuration.qmd
          - distribution.qmd
      - section: プロジェクトに参加する
        contents:
          - development.qmd
          - demo.qmd

format:
  html:
    theme: brand
    toc: true
    code-copy: true
    link-external-icon: false
