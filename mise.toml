[task_config]
shell = "nu --no-config-file -c"

[tasks.setup]
description = "Enable Git hooks and merge commits for this repository"
run = [
  "git config --local core.hooksPath .githooks",
  "git config --local merge.ff false",
  { task = "setup:check" },
]

[tasks."setup:check"]
description = "Verify the local Git settings and the pre-commit hook"
hide = true
run = '''
def check-setting [key: string, expected: string] {
  let local_value = (try { ^git config --local --get $key } catch { "<unset>" })
  let effective_value = (try { ^git config --get $key } catch { "<unset>" })
  if $local_value != $expected or $effective_value != $expected {
    print --stderr $"FAIL  ($key) expected ($expected), local ($local_value), effective ($effective_value)"
    exit 1
  }
  print $"OK  ($key) = ($effective_value)"
}

check-setting core.hooksPath ".githooks"
check-setting merge.ff "false"
let hook = (^git rev-parse --git-path hooks/pre-commit)
if ($hook | path expand | path type) != "file" or (^test -x $hook | complete).exit_code != 0 {
  print --stderr $"FAIL  Expected an executable pre-commit hook at ($hook)"
  exit 1
}
print $"OK  ($hook) is executable"
'''

[tasks.QA]
depends     = ["format", "lint"]
description = "Run all formatting and lint checks"

[tasks.QA-fix]
depends     = ["fix:*"]
description = "Apply available fixes, then run all formatting and lint checks"
run         = [{ task = "QA" }]

[tasks.format]
depends     = ["fmt:*"]
description = "Check formatting across all languages"

[tasks."fmt:nix"]
description = "Check Nix formatting with nixfmt"
hide        = true
run         = "fd --hidden --exclude .git --type f --extension nix --exec-batch nixfmt --check"

[tasks."fmt:toml"]
description = "Check TOML formatting with Taplo"
env         = { RUST_LOG = "WARN" }
hide        = true
run         = "taplo fmt --check"

[tasks."fmt:r"]
description = "Check R formatting with Air"
hide        = true
run         = "air format --check ."

[tasks.lint]
depends     = ["lint:*"]
description = "Run linters across all languages"

[tasks."lint:nix"]
description = "Lint Nix files with statix"
hide        = true
run         = "statix check ."

[tasks."lint:toml"]
description = "Lint TOML files with Taplo"
env         = { RUST_LOG = "WARN" }
hide        = true
run         = "taplo lint"

[tasks."lint:r"]
description = "Lint R files with Jarl"
hide        = true
run         = "jarl check ."

[tasks."fix:nix"]
description = "Apply statix fixes and format Nix files with nixfmt"
hide = true
run = [
  "statix fix .",
  "fd --hidden --exclude .git --type f --extension nix --exec-batch nixfmt",
]

[tasks."fix:toml"]
description = "Format TOML files with Taplo"
env         = { RUST_LOG = "WARN" }
hide        = true
run         = "taplo fmt"

[tasks."fix:r"]
description = "Apply safe Jarl fixes and format R files with Air"
hide = true
run = [
  "jarl check --fix-only --allow-dirty .",
  "air format .",
]
