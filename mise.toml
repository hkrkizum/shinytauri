[task_config]
shell = "nu --no-config-file -c"

[tasks.setup]
description = "Enable Git hooks and merge commits for this repository"
run = [
  "git config --local core.hooksPath .githooks",
  "git config --local merge.ff false",
  { task = "setup:check" },
]

[tasks."setup:check"]
description = "Verify the local Git settings and the pre-commit hook"
hide        = true
run         = "nu --no-config-file scripts/setup-check.nu"

[tasks.QA]
depends     = ["format", "lint"]
description = "Run all formatting and lint checks"

[tasks.QA-fix]
depends     = ["fix:*"]
description = "Apply available fixes, then run all formatting and lint checks"
run         = [{ task = "QA" }]

[tasks.format]
depends     = ["fmt:*"]
description = "Check formatting across all languages"

[tasks."fmt:nu"]
description = "Check Nushell formatting with nufmt"
hide        = true
run         = "fd --hidden --exclude .git --type f --extension nu --exec-batch nufmt --dry-run"

[tasks."fmt:nix"]
description = "Check Nix formatting with nixfmt"
hide        = true
run         = "fd --hidden --exclude .git --type f --extension nix --exec-batch nixfmt --check"

[tasks."fmt:toml"]
description = "Check TOML formatting with Taplo"
env         = { RUST_LOG = "WARN" }
hide        = true
run         = "taplo fmt --check"

[tasks."fmt:r"]
description = "Check R formatting with Air"
hide        = true
run         = "air format --check ."

[tasks.lint]
depends     = ["lint:*"]
description = "Run linters across all languages"

[tasks."lint:nu"]
description = "Lint Nushell scripts with nu-lint"
hide        = true
run         = "fd --hidden --exclude .git --type f --extension nu --exec-batch nu-lint check"

[tasks."lint:nix"]
description = "Lint Nix files with statix"
hide        = true
run         = "statix check ."

[tasks."lint:toml"]
description = "Lint TOML files with Taplo"
env         = { RUST_LOG = "WARN" }
hide        = true
run         = "taplo lint"

[tasks."lint:r"]
description = "Lint R files with Jarl"
hide        = true
run         = "jarl check ."

[tasks."fix:nu"]
description = "Apply nu-lint fixes and format Nushell scripts with nufmt"
hide = true
run = [
  "fd --hidden --exclude .git --type f --extension nu --exec-batch nu-lint fix",
  "fd --hidden --exclude .git --type f --extension nu --exec-batch nufmt",
]

[tasks."fix:nix"]
description = "Apply statix fixes and format Nix files with nixfmt"
hide = true
run = [
  "statix fix .",
  "fd --hidden --exclude .git --type f --extension nix --exec-batch nixfmt",
]

[tasks."fix:toml"]
description = "Format TOML files with Taplo"
env         = { RUST_LOG = "WARN" }
hide        = true
run         = "taplo fmt"

[tasks."fix:r"]
description = "Apply safe Jarl fixes and format R files with Air"
hide = true
run = [
  "jarl check --fix-only --allow-dirty .",
  "air format .",
]
