# Settings ─────────────────────────────────────────────────────────────────────
[env]
RIG_MODE = "user"

[task_config]
shell = "nu --no-config-file -c"

# Setup Tasks ──────────────────────────────────────────────────────────────────
[tasks.setup]
description = "Configure Git and restore the project's R environment"
run = [
  "git config --local core.hooksPath .githooks",
  "git config --local merge.ff false",
  { task = "setup:r" },
  { task = "setup:check" },
]

[tasks."setup:r"]
description = "Install the locked R version and restore the Rhino project library"
dir         = "src-shiny"
hide        = true
run         = "rig proj sync --locked"

[tasks."setup:check"]
description = "Verify the local Git settings and the pre-commit hook"
hide        = true
run         = "nu --no-config-file scripts/setup-check.nu"

# Quality Assurance ────────────────────────────────────────────────────────────
[tasks.QA]
depends     = ["format", "lint"]
description = "Run all formatting and lint checks"

[tasks.QA-ci]
depends     = ["QA", "test"]
description = "Run formatting, lint and the regular test suites"

[tasks.QA-full]
depends     = ["QA", "test-full"]
description = "Run formatting, lint and all tests including heavy cases"

[tasks.QA-fix]
depends     = ["fix:*"]
description = "Apply available fixes, then run all formatting and lint checks"
run         = [{ task = "QA" }]

# Tests ────────────────────────────────────────────────────────────────────────
[tasks.test]
depends     = ["test:testthat", "test:shinytest2", "test:tauri", "test:bundle"]
description = "Run Rhino, browser, Tauri and bundle tests in parallel"

[tasks.test-full]
description = "Run all test suites including heavy cases"
env         = { SHINYTAURI_HEAVY_TESTS = "1" }
run         = "mise run test"

[tasks."test:testthat"]
description = "Run Rhino unit tests with testthat"
dir         = "src-shiny"
run         = """rig run -e 'rhino::test_r(filter = "^shinytest2", invert = TRUE)'"""

[tasks."test:shinytest2"]
description = "Run Rhino browser tests with shinytest2"
dir         = "src-shiny"
env         = { NOT_CRAN = "true" }
run         = """rig run -e 'rhino::test_r(filter = "^shinytest2")'"""

[tasks."test:bundle"]
description = "Test packaging with the locked build R environment"
run = [
  "rig proj sync --locked",
  "rig run --rscript scripts/tests/test-bundle.R",
]

[tasks."test:tauri"]
description = "Run Tauri tests in parallel with cargo-nextest"
dir = "src-tauri"
run = '''
let ignored = if $env.SHINYTAURI_HEAVY_TESTS? == "1" { "all" } else { "default" }
cargo nextest run --locked --run-ignored $ignored
'''

# Formatting and Linting ───────────────────────────────────────────────────────
[tasks.format]
depends     = ["fmt:*"]
description = "Check formatting across all languages"

[tasks."fmt:nu"]
description = "Check Nushell formatting with nufmt"
hide        = true
run         = "fd --hidden --exclude .git --type f --extension nu --exec-batch nufmt --dry-run"

[tasks."fmt:nix"]
description = "Check Nix formatting with nixfmt"
hide        = true
run         = "fd --hidden --exclude .git --type f --extension nix --exec-batch nixfmt --check"

[tasks."fmt:toml"]
description = "Check TOML formatting with Taplo"
env         = { RUST_LOG = "WARN" }
hide        = true
run         = "taplo fmt --check"

[tasks."fmt:r"]
description = "Check R formatting with Air"
hide        = true
run         = "air format --check ."

[tasks.lint]
depends     = ["lint:*"]
description = "Run linters across all languages"

[tasks."lint:nu"]
description = "Lint Nushell scripts with nu-lint"
hide        = true
run         = "fd --hidden --exclude .git --type f --extension nu --exec-batch nu-lint check"

[tasks."lint:nix"]
description = "Lint Nix files with statix"
hide        = true
run         = "statix check ."

[tasks."lint:toml"]
description = "Lint TOML files with Taplo"
env         = { RUST_LOG = "WARN" }
hide        = true
run         = "taplo lint"

[tasks."lint:r"]
description = "Lint R files with Jarl"
hide        = true
run         = "jarl check ."

[tasks."fix:nu"]
description = "Apply nu-lint fixes and format Nushell scripts with nufmt"
hide = true
run = [
  "fd --hidden --exclude .git --type f --extension nu --exec-batch nu-lint fix",
  "fd --hidden --exclude .git --type f --extension nu --exec-batch nufmt",
]

[tasks."fix:nix"]
description = "Apply statix fixes and format Nix files with nixfmt"
hide = true
run = [
  "statix fix .",
  "fd --hidden --exclude .git --type f --extension nix --exec-batch nixfmt",
]

[tasks."fix:toml"]
description = "Format TOML files with Taplo"
env         = { RUST_LOG = "WARN" }
hide        = true
run         = "taplo fmt"

[tasks."fix:r"]
description = "Apply safe Jarl fixes and format R files with Air"
hide        = true
run         = ["jarl check --fix-only --allow-dirty .", "air format ."]

# Run  ───────────────────────────────────────────────────────
[tasks."run:tauri"]
description = "Run the Tauri application"
run         = "cargo tauri dev"

[tasks."build:windows"]
description = "Build an offline Windows installer for the selected Shiny app"
run = '''
if $nu.os-info.name == "linux" and $env.SHINYTAURI_WINDOWS_SHELL? != "1" {
  ^nix develop .#windows -c mise run build:windows $env.usage_bundle
} else {
  ^rig proj sync --locked
  ^rig run --rscript scripts/build-windows.R $env.usage_bundle
}
'''
usage = 'arg "[bundle]" help="Bundle TOML path" default="bundles/rhino.toml"'
