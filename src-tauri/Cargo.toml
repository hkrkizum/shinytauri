[package]
description  = "Desktop host for the shinytauri Rhino application"
edition      = "2024"
license      = "MIT"
name         = "shinytauri"
rust-version = "1.100"
version      = "0.1.0"

[build-dependencies]
tauri-build = { features = [], version = "2.7.6" }

[dependencies]
httparse   = "1"
serde      = { features = ["derive"], version = "1" }
serde_json = "1"
tauri      = { features = [], version = "2.12.7" }

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
tempfile = "3"
windows-sys = { features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
], version = "0.61" }
