<!doctype html>
<html lang="ja" data-shinytauri-startup>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Shiny アプリ</title>
    <link rel="stylesheet" href="startup.css">
    <script src="startup.js" defer></script>
  </head>
  <body>
    <main>
      <h1 id="startup-title">Shiny アプリ</h1>
      <section class="status" aria-labelledby="startup-stage">
        <div class="status-row">
          <span class="indicator" aria-hidden="true"></span>
          <h2 id="startup-stage" aria-live="polite" aria-atomic="true">起動情報を待機中</h2>
          <div class="elapsed">
            <span>経過時間</span>
            <span id="startup-elapsed" role="timer" aria-live="off">—</span>
          </div>
        </div>
        <p id="startup-error" hidden></p>
      </section>
      <details id="log-files" hidden>
        <summary>ログファイルの場所</summary>
        <dl>
          <div id="host-file" hidden>
            <dt>ホストの起動ログ（JSON Lines）</dt>
            <dd><code id="host-log"></code></dd>
          </div>
          <div id="r-file" hidden>
            <dt>R の出力</dt>
            <dd><code id="r-log"></code></dd>
          </div>
        </dl>
      </details>
      <section id="history" aria-labelledby="history-heading" hidden>
        <h2 id="history-heading">起動履歴</h2>
        <ol id="startup-events"></ol>
      </section>
    </main>
  </body>
</html>
