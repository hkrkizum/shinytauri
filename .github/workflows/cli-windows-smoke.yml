name: Windows CLI acceptance

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    paths:
      - 'cli/**'
      - 'notices/**'
      - 'src-tauri/**'
      - 'src-shiny/**'
      - 'ui/**'
      - 'bundles/**'
      - 'examples/**'
      - 'scripts/**'
      - 'rproj.*'
      - 'rust-toolchain.toml'
      - 'flake.*'
      - 'nix/**'
      - '.github/workflows/cli-windows-smoke.yml'

permissions:
  contents: read

jobs:
  installers:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: minimal
            runner: ubuntu-24.04
          - app: rhino
            runner: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Nix for the Windows cross-build
        if: runner.os == 'Linux'
        uses: cachix/install-nix-action@bb0495a1086c46893eee56f32fd192dfe4a15bb9 # v32.0.0
      - name: Install Windows build tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          function Install-ZipTool($url, $sha256, $exe) {
            $archive = Join-Path $env:RUNNER_TEMP "$exe.zip"
            Invoke-WebRequest $url -OutFile $archive
            if ((Get-FileHash $archive).Hash -ne $sha256) { throw "$exe checksum mismatch" }
            $dir = Join-Path $env:RUNNER_TEMP "$exe-tool"
            Expand-Archive $archive $dir
            $found = @(Get-ChildItem $dir -Recurse -Filter $exe)
            if ($found.Count -ne 1) { throw "Expected one $exe in the tool archive" }
            $found[0].DirectoryName >> $env:GITHUB_PATH
          }
          Install-ZipTool 'https://github.com/r-lib/rig/releases/download/v0.11.1/rig-windows-x86_64-0.11.1.zip' 'a0ce65f2afb2f016488523818d14c4596080c61f32d0dab4c123c7f5e1db8910' 'rig.exe'
          Install-ZipTool 'https://github.com/tauri-apps/tauri/releases/download/tauri-cli-v2.12.6/cargo-tauri-x86_64-pc-windows-msvc.zip' '39636fa68bc00f13dd610fb57688f292e93742978cc35395f2f1be7c540b88a1' 'cargo-tauri.exe'
      - name: Build the Linux CLI in the Windows cross-build shell
        if: runner.os == 'Linux'
        run: nix develop --no-update-lock-file .#windows -c cargo build --locked --release --manifest-path cli/Cargo.toml
      - name: Check that distribution notices match the locked Cargo dependencies
        if: runner.os == 'Linux'
        env:
          RIG_MODE: user
        run: |
          nix develop --no-update-lock-file .#windows -c bash -ec '
            rig proj sync --locked
            rig run --rscript scripts/generate-notices.R --check
          '
      - name: Build the Windows CLI
        if: runner.os == 'Windows'
        run: cargo build --locked --release --manifest-path cli/Cargo.toml
      - name: Test the CLI on Windows
        if: runner.os == 'Windows'
        run: cargo test --manifest-path cli/Cargo.toml --locked
      - name: Build the standalone Rust acceptance driver
        run: cargo build --locked --manifest-path scripts/tests/windows-acceptance/Cargo.toml
      - name: Package the external projects with the standalone CLI
        shell: pwsh
        env:
          FIXTURE: ${{ matrix.app }}
          RIG_MODE: user
        run: |
          $suffix = if ($IsWindows) { '.exe' } else { '' }
          & "./scripts/tests/windows-acceptance/target/debug/shinytauri-acceptance$suffix" package `
            $env:FIXTURE "cli/target/release/shinytauri$suffix" $env:GITHUB_WORKSPACE $env:RUNNER_TEMP
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-installer-${{ matrix.app }}
          path: |
            ${{ runner.temp }}/${{ matrix.app }}*-setup.exe
            ${{ runner.temp }}/shinytauri-sources-*.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 2

  installed-apps:
    needs: installers
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            scripts/tests
            notices
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: windows-installer-*
          path: ${{ runner.temp }}/installers
          merge-multiple: true
      - name: Test the Rust acceptance driver
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cargo test --locked --manifest-path scripts/tests/windows-acceptance/Cargo.toml
          cargo build --locked --manifest-path scripts/tests/windows-acceptance/Cargo.toml
      - name: Prepare the WebView2 runtime
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $edgeRoot = "${env:ProgramFiles(x86)}/Microsoft/EdgeWebView/Application"
          if (!(Test-Path "$edgeRoot/*/msedgewebview2.exe")) {
            $bootstrap = Join-Path $env:RUNNER_TEMP 'WebView2Setup.exe'
            Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $bootstrap
            $install = Start-Process $bootstrap -ArgumentList '/silent','/install' -Wait -PassThru
            if ($install.ExitCode) { throw "WebView2 installation failed: $($install.ExitCode)" }
          }
      - name: Install both products, exercise their windows, and close them
        run: ./scripts/tests/windows-acceptance/target/debug/shinytauri-acceptance.exe installed-apps
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: windows-acceptance-evidence
          path: ${{ runner.temp }}/windows-acceptance
          if-no-files-found: warn
          retention-days: 5
