[project]
name    = "shinytauri"
type    = "project"
version = "0.1.0"

[dependencies]
DT             = "*"
R              = ">= 4.6"
S7             = "*"
base64enc      = "*"
box            = "*"
bslib          = "*"
curl           = "*"
knitr          = "*"
mirai          = "*"
processx       = "*"
rhino          = "*"
rmarkdown      = "*"
shiny          = "*"
"shiny.router" = "*"
xml2           = "*"

[tool.rig]
platforms     = ["x86_64-unknown-linux-gnu", "x86_64-w64-mingw32"]
prefer-binary = true
r-versions    = ["4.6.2"]

[dependency-groups.dev]
callr      = "*"
shinytest2 = "*"
testthat   = "*"
