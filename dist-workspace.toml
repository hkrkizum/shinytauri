[workspace]
members = ["cargo:cli"]

[dist]
auto-includes      = false
cargo-dist-version = "0.34.0"
checksum           = "sha256"
include            = ["LICENSE", "notices"]
source-tarball     = false
targets            = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu"]
unix-archive       = ".tar.xz"
windows-archive    = ".zip"
